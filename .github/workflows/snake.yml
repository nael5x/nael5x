name: Generate contribution snake

on:
  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nael5x

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237C3AED&color_dots=%23E2E8F0,%23BAE6FD,%2367E8F9,%2322D3EE,%2310B981
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23A78BFA&color_dots=%2313293D,%23164E63,%230E7490,%2322D3EE,%2310B981

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
