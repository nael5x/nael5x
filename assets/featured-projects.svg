<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860">
<style>
:root{
  --bg:#0A101F;
  --panel:#07111F;
  --panel2:#0B1728;
  --text:#F8FAFC;
  --muted:#94A3B8;
  --cyan:#22D3EE;
  --purple:#A78BFA;
  --accent:#10B981;
  --border:#164E63;
  --line:#123047;
}
text{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
.title{fill:var(--cyan);font-weight:700;letter-spacing:1px}
.muted{fill:var(--muted)}
.white{fill:var(--text)}
.purple{fill:var(--purple)}
.green{fill:var(--accent)}
.card{fill:var(--panel2);stroke:var(--border);stroke-width:1}
.tag{fill:#0A101F;stroke:var(--purple);stroke-width:1}
.btn{fill:#0A101F;stroke:var(--cyan);stroke-width:1}
</style>

<rect width="1180" height="860" fill="var(--bg)"/>
<rect x="16" y="16" width="1148" height="828" rx="12" fill="var(--panel)" stroke="var(--cyan)" stroke-width="1.2"/>

